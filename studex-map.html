    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #map {
            flex-grow: 1;
            width: 100%;
            z-index: 1;
        }
        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 1rem center;
            background-size: 1.2em;
        }
        .my-location-icon {
            background-color: #2563EB;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.55);
            position: relative;
        }
        .my-location-icon::after {
            content: '';
            position: absolute;
            top: -9px;
            left: -9px;
            right: -9px;
            bottom: -9px;
            border: 2px solid #2563EB;
            border-radius: 50%;
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        /* سهم الاتجاه حول نقطة موقعي */
        .heading-wrap { position: absolute; left: 50%; top: 50%; width: 0; height: 0; display: none; transition: transform .3s linear; pointer-events: none; }
        .heading-wrap.on { display: block; }
        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* الدبوس: الحاوية بحجم صفر عند الإحداثية بالضبط، والنقطة متمركزة عليها */
        .faculty-pin {
            position: relative;
            width: 0;
            height: 0;
            cursor: pointer;
        }
        .faculty-dot {
            position: absolute;
            left: -6px;
            top: -6px;
            width: 12px;
            height: 12px;
            background-color: #2563EB;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        /* الاسم يطفو فوق النقطة دون التأثير على موضعها */
        .faculty-label {
            position: absolute;
            left: 0;
            bottom: 10px;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 8px;
            border: 1.5px solid #2563EB;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .faculty-pin:hover { z-index: 9999; }
        .faculty-pin:hover .faculty-label { background: #2563EB; }
        /* عند الزوم أوت: نخفي الأسماء ونترك النقاط الثابتة فقط */
        .labels-hidden .faculty-label { display: none; }
        .labels-hidden .faculty-pin:hover .faculty-label { display: flex; }

        .gate-label { border-color: #10b981; background: rgba(6, 78, 59, 0.92); }
        .gate-dot { background-color: #10b981; }
        .landmark-label { border-color: #f59e0b; background: rgba(120, 53, 15, 0.92); }
        .landmark-dot { background-color: #f59e0b; }
        .cafe-label { border-color: #a855f7; background: rgba(59, 7, 100, 0.92); }
        .cafe-dot { background-color: #a855f7; }
        .kiosk-label { border-color: #06b6d4; background: rgba(8, 51, 68, 0.92); }
        .kiosk-dot { background-color: #06b6d4; }
        .office-label { border-color: #0d9488; background: rgba(4, 47, 46, 0.92); }

            if (!FIREBASE_URL) return;
            try {

                showMessage('انحفظ المكان على جهازك فقط، وتعذر حفظه أونلاين. تأكد من قواعد قاعدة البيانات ورابطها.');

        async function loadRemotePlaces() {
            if (!FIREBASE_URL) return;
            try {
                const r = await fetch(fbUrl('/places'));
                if (!r.ok) throw new Error(r.status);
                const data = (await r.json()) || {};
                // رفع الأماكن المحلية القديمة التي لم تُرفع بعد
                customPlaces.forEach(pl => { if (!data[pl.id]) remoteSave(pl); });

                    if (!okIcons[d.type] || !isFinite(d.lat) || !isFinite(d.lng)) return;
                    const pl = { id: String(id).replace(/[^\w-]/g, ''), name: clean(d.name), shortName: clean(d.shortName || d.name), lat: +d.lat, lng: +d.lng, type: d.type, icon: okIcons[d.type], custom: true };

        // ===== سهم الاتجاه =====
        const ARROW_SVG = '<svg viewBox="0 0 24 24" width="30" height="30" style="display:block;filter:drop-shadow(0 2px 4px rgba(11,19,41,.55))"><path d="M12 1.5 L21.5 21.5 L12 16.8 L2.5 21.5 Z" fill="#2563EB" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12 6.5 L16.6 17.2 L12 14.9 Z" fill="#93c5fd"/><path d="M12 6.5 L7.4 17.2 L12 14.9 Z" fill="#1d4ed8"/></svg>';
        function bearing(a, b) {
            const t = Math.PI / 180;
            const y = Math.sin((b.lng - a.lng) * t) * Math.cos(b.lat * t);
            const x = Math.cos(a.lat * t) * Math.sin(b.lat * t) - Math.sin(a.lat * t) * Math.cos(b.lat * t) * Math.cos((b.lng - a.lng) * t);
            return (Math.atan2(y, x) / t + 360) % 360;
        }
        // اتجاه المسار قدّامك (حوالي 12 متر للأمام)
        function aheadBearing(sn) {
            const c = lastRouteCoords;
            let acc = 0, prev = sn.pt;
            for (let j = sn.i + 1; j < c.length; j++) {
                acc += prev.distanceTo(c[j]);
                prev = c[j];
                if (acc >= 12 || j === c.length - 1) return bearing(sn.pt, c[j]);
            }
            return null;
        }
        function setUserHeading(deg) {
            if (!userMarker || deg == null || isNaN(deg)) return;
            const el = userMarker.getElement();
            const w = el && el.querySelector('.heading-wrap');
            if (!w) return;
            if (arrived) { w.classList.remove('on'); return; }
            if (headingLast === null) { headingCum = deg; }
            else { headingCum += ((deg - headingLast + 540) % 360) - 180; }
            headingLast = deg;
            w.classList.add('on');
            w.style.transform = 'rotate(' + headingCum + 'deg)';
        }
        // سهم عند نقطة الانطلاق الثابتة (غير الـ GPS) يشير لاتجاه المسار
        function updateStartArrow(show, ll, deg) {
            if (!show) {
                if (startArrowMarker) { map.removeLayer(startArrowMarker); startArrowMarker = null; }
                return;
            }
            const icon = L.divIcon({
                className: 'bg-transparent border-0',
                html: '<div style="transform:rotate(' + (deg || 0) + 'deg);width:30px;height:30px">' + ARROW_SVG + '</div>',
                iconSize: [30, 30], iconAnchor: [15, 15]
            });
            if (!startArrowMarker) startArrowMarker = L.marker(ll, { icon, interactive: false, zIndexOffset: 900 }).addTo(map);
            else { startArrowMarker.setLatLng(ll); startArrowMarker.setIcon(icon); }
        }

        function snapToRoute(ll) {
            const c = lastRouteCoords;

            const kx = Math.cos(ll.lat * Math.PI / 180) * 111320, ky = 110574;
            let best = null;
            for (let i = 0; i < c.length - 1; i++) {
                const ax = (c[i].lng - ll.lng) * kx, ay = (c[i].lat - ll.lat) * ky;
                const bx = (c[i + 1].lng - ll.lng) * kx, by = (c[i + 1].lat - ll.lat) * ky;
                const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
                const t = len2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2)) : 0;
                const px = ax + t * dx, py = ay + t * dy, d = Math.hypot(px, py);
                if (!best || d < best.off) best = { i, off: d, pt: L.latLng(ll.lat + py / ky, ll.lng + px / kx) };
            }
            let rem = best.pt.distanceTo(c[best.i + 1]);
            for (let j = best.i + 1; j < c.length - 1; j++) rem += c[j].distanceTo(c[j + 1]);
            best.remaining = rem;
            return best;
        }
        function showRemaining(dist) {
            const mins = Math.max(1, Math.ceil(dist / WALK_M_PER_MIN));
            if (dist < 15) {
                document.getElementById('distanceDisplay').textContent = 'وصلت! 🎉';
                document.getElementById('timeDisplay').textContent = '0 د';
            } else {
                document.getElementById('distanceDisplay').textContent = dist < 1000 ? Math.round(dist) + ' م' : (dist / 1000).toFixed(2) + ' كم';
                document.getElementById('timeDisplay').textContent = mins + ' دقيقة';
            }
        }
        // يحدّث المسافة والوقت وخط المسار فوراً مع كل حركة. يرجع false إذا ابتعدت عن المسار
        function applyProgress(ll) {
            const sn = snapToRoute(ll);
            if (!sn || sn.off > 40) return false;
            if (routeLine) routeLine.setLatLngs([ll, sn.pt, ...lastRouteCoords.slice(sn.i + 1)]);
            const total = sn.remaining + sn.off;
            if (total < 20) arrived = true;
            setUserHeading(aheadBearing(sn));
            updateMarkerFocus();
            showRemaining(total);
            return true;
        }

                if (show && !map.hasLayer(mk)) mk.addTo(map);
                else if (!show && map.hasLayer(mk)) map.removeLayer(mk);

            const i = locations.findIndex(l => l.id === id);

                customPlaces = customPlaces.filter(p => p.id !== id);

                remoteDelete(id);
            } else {
                if (!hiddenIds.includes(id)) hiddenIds.push(id);
                try { localStorage.setItem('studexmap_hidden', JSON.stringify(hiddenIds)); } catch (e) {}

        function updateLiveUserPosition(lat, lng, accuracy = 15, isSimulated = false) {
            userLocation = { lat, lng };
            const latLng = L.latLng(lat, lng);

            if (!userMarker) {
                const icon = L.divIcon({ className: 'my-location-icon', iconSize: [18, 18], html: '<div class="heading-wrap"><div style="position:absolute;left:-15px;top:-44px">' + ARROW_SVG + '</div></div>' });
                userMarker = L.marker(latLng, { icon, zIndexOffset: 1000 })
                    .addTo(map)
                    .bindPopup(isSimulated ? "🚶 موقعك الافتراضي الحي (تجربة)" : "📍 موقعك الفعلي المباشر (Live)");
            } else {
                userMarker.setLatLng(latLng);
            }

            if (!accuracyCircle) {
                accuracyCircle = L.circle(latLng, {
                    radius: accuracy,
                    color: '#38bdf8',
                    fillColor: '#38bdf8',
                    fillOpacity: 0.12,
                    weight: 1
                }).addTo(map);
            } else {
                accuracyCircle.setLatLng(latLng);
                accuracyCircle.setRadius(accuracy);
            }

            document.getElementById('accuracyDisplay').textContent = isSimulated ? 'محاكاة حية' : `±${Math.round(accuracy)} متر`;

            const eId = document.getElementById('endSelect').value;
            if (isRoutingActive && eId && !arrived) {
                const el = locations.find(x => x.id === eId);
                if (el && latLng.distanceTo(L.latLng(el.lat, el.lng)) < 20) { arrived = true; updateMarkerFocus(); }
            }
            if (prevPos && prevPos.distanceTo(latLng) >= 3) { setUserHeading(bearing(prevPos, latLng)); prevPos = latLng; }
            else if (!prevPos) { prevPos = latLng; }
            if (followUser) map.panTo(latLng, { animate: true });
            updateWalkBtn();
            if (isRoutingActive && document.getElementById('startSelect').value === 'gps') {
                if (applyProgress(latLng)) {
                    if (Date.now() - lastFetchTs > 30000) drawAndCalculateRoute(false, false);
                } else {
                    drawAndCalculateRoute(false, false);
                }
            }
        }

        // جلب مسار مشي حقيقي على الشوارع والممرات (OpenStreetMap / OSRM مشاة)
        async function fetchWalkingRoute(a, b) {
            const url = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 8000);
            try {
                const res = await fetch(url, { signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('no route');
                const r = data.routes[0];
                const coords = r.geometry.coordinates.map(c => L.latLng(c[1], c[0]));
                return { coords, distance: r.distance };
            } finally {
                clearTimeout(t);
            }
        }

        // تنبيه عندما يكون المسار تقديرياً (تعذر جلب مسار المشي الحقيقي)
        function setRouteWarning(show) {
            let el = document.getElementById('routeWarn');
            if (!el) {
                el = document.createElement('div');
                el.id = 'routeWarn';
                el.className = 'hidden mt-2 p-2 bg-amber-50 border border-amber-300 rounded-xl text-amber-800 text-xs font-bold items-center gap-2';
                el.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><span>تعذر جلب مسار المشي، الخط المنقّط تقدير تقريبي بخط مستقيم وقد يمر عبر مبانٍ. الوقت والمسافة تقريبيان.</span>';
                document.getElementById('infoPanel').insertAdjacentElement('afterend', el);
            }
            el.classList.toggle('hidden', !show);
            el.classList.toggle('flex', show);
        }

        function pathLength(coords) {
            let d = 0;
            for (let i = 1; i < coords.length; i++) d += coords[i - 1].distanceTo(coords[i]);
            return d;
        }

        // force = true: اطلب مسار جديد فوراً | false: التزم بفاصل زمني (للتتبع الحي)
        async function drawAndCalculateRoute(fitMapBounds = true, force = true) {
            const sVal = document.getElementById('startSelect').value;
            const eVal = document.getElementById('endSelect').value;
            if (!sVal || !eVal) return;

            let startPt;
            if (sVal === 'gps') {
                if (!userLocation) return;
                startPt = L.latLng(userLocation.lat, userLocation.lng);
            } else {
                const l = locations.find(x => x.id === sVal);
                startPt = L.latLng(l.lat, l.lng);
                document.getElementById('accuracyDisplay').textContent = 'نقطة ثابتة';
            }

            const endL = locations.find(x => x.id === eVal);
            const endPt = L.latLng(endL.lat, endL.lng);

            if (!force && Date.now() - lastFetchTs < ROUTE_REFRESH_MS) return;
            lastFetchTs = Date.now();
            const myReq = ++routeReqId;

            // دبوس الوجهة
            if (endMarker) map.removeLayer(endMarker);
            const endIcon = L.divIcon({
                className: 'bg-transparent',
                html: `<div class="sx-end"><svg viewBox="0 0 32 44" width="32" height="44" style="display:block;filter:drop-shadow(0 4px 6px rgba(11,19,41,.5))"><defs><linearGradient id="sxEg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/></linearGradient></defs><path d="M16 1C8 1 2 7.2 2 15c0 10.5 14 28 14 28s14-17.5 14-28C30 7.2 24 1 16 1z" fill="url(#sxEg)" stroke="#fff" stroke-width="2.5"/><circle cx="16" cy="15" r="5.5" fill="#fff"/></svg><span class="sx-end-pulse"></span></div>`,
                iconSize: [32, 44],
                iconAnchor: [16, 43]
            });
            endMarker = L.marker(endPt, { icon: endIcon }).addTo(map).bindPopup("الوجهة: " + endL.name);
            if (fitMapBounds) endMarker.openPopup();

            let coords, dist, approx = false;
            try {
                const r = await fetchWalkingRoute(startPt, endPt);
                // ربط نقطة البداية والنهاية الفعلية بأقرب نقطة على الطريق
                coords = [startPt, ...r.coords, endPt];
                dist = pathLength(coords);
            } catch (err) {
                // احتياطي: خط مستقيم تقريبي، مع تنبيه واضح للمستخدم
                coords = [startPt, endPt];
                dist = startPt.distanceTo(endPt) * 1.25;
                approx = true;
            }

            if (myReq !== routeReqId) return; // وصل طلب أحدث، تجاهل هذا

            lastRouteCoords = coords;
            const sn0 = snapToRoute(startPt);
            const hd0 = sn0 ? aheadBearing(sn0) : null;
            if (sVal === 'gps') { updateStartArrow(false); if (hd0 != null) setUserHeading(hd0); }
            else { updateStartArrow(true, startPt, hd0 == null ? 0 : hd0); }

            if (routeLine) map.removeLayer(routeLine);
            routeLine = L.polyline(coords, {
                color: approx ? '#f59e0b' : '#3b82f6',
                className: approx ? 'sx-route sx-route-approx' : 'sx-route',
                weight: approx ? 6 : 9,
                opacity: 1,
                dashArray: approx ? '4 10' : null,
                lineJoin: 'round',
                lineCap: 'round'
            }).addTo(map);
            setRouteWarning(approx);

            if (fitMapBounds) {
                map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
            }

            if (dist < 20) arrived = true;
            updateMarkerFocus();
            updateWalkBtn();
            const mins = Math.max(1, Math.ceil(dist / WALK_M_PER_MIN));
            document.getElementById('infoPanel').classList.remove('hidden');
            document.getElementById('infoPanel').classList.add('flex');

            if (dist < 15) {
                document.getElementById('distanceDisplay').textContent = 'وصلت! 🎉';
                document.getElementById('timeDisplay').textContent = '0 د';
            } else {
                document.getElementById('distanceDisplay').textContent = dist < 1000 ? Math.round(dist) + ' م' : (dist / 1000).toFixed(2) + ' كم';
                document.getElementById('timeDisplay').textContent = mins + ' دقيقة';
            }
        }

        function ensureGpsOptionSelected() {
            const startSelect = document.getElementById('startSelect');
            let opt = Array.from(startSelect.options).find(o => o.value === 'gps');
            if (!opt) {
                opt = new Option("🔴 موقعي المباشر (Live GPS)", "gps");

        document.addEventListener('DOMContentLoaded', () => {
            const startSelect = document.getElementById('startSelect');
            const endSelect = document.getElementById('endSelect');

            locations.forEach(loc => {
                startSelect.add(new Option(loc.name, loc.id));
                endSelect.add(new Option(loc.name, loc.id));
            });

            // حدود الخريطة: الحرم + حوالي 200 متر من كل جهة (بدون حد أقصى للزوم إن)
            const CAMPUS_BOUNDS = L.latLngBounds([32.0035, 35.8649], [32.0235, 35.8806]);
            map = L.map('map', { zoomControl: false, maxBounds: CAMPUS_BOUNDS, maxBoundsViscosity: 1.0, minZoom: 14 }).setView([32.0145, 35.8725], 16);
            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri | Routing &copy; OpenStreetMap', maxZoom: 19, keepBuffer: 2
            }).addTo(map);

            // طبقة أسماء الشوارع الإضافية معطّلة لتخفيف الحمل (فعّلها بإزالة التعليق إذا احتجتها):
            // L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

            renderAllCampusMarkers();
            loadRemotePlaces();
            updateLabelsVisibility();
            map.on('zoomend', updateLabelsVisibility);
            map.on('moveend zoomend', updateMarkerFocus);
            map.on('dragstart', () => { followUser = false; });

            // أداة التقاط الإحداثيات: فعّلها واضغط على مكان الكشك/الكافيه على الخريطة
            let pickMode = false;
            const PickCtl = L.Control.extend({
                options: { position: 'topright' },
                onAdd() {
                    const b = L.DomUtil.create('button', '');
                    b.innerHTML = '<span class="sx-ic">📌</span><span class="sx-tl">التقاط موقع</span>'; b.title = 'التقاط موقع';
                    b.className = 'sx-tool sx-tool-pick';
                    L.DomEvent.disableClickPropagation(b);
                    b.onclick = () => {
                        window.stopPick = () => { if (pickMode) b.onclick(); };
                        if (!pickMode && !unlocked) { askPassword(() => b.onclick()); return; }
                        pickMode = !pickMode;
                        if (!pickMode) cancelNewPlace();
                        if (pickMode && window.stopDelete) window.stopDelete();
                        b.classList.toggle('on', pickMode);
                        b.innerHTML = pickMode ? '<span class="sx-ic">📌</span><span class="sx-tl">اضغط على الخريطة...</span>' : '<span class="sx-ic">📌</span><span class="sx-tl">التقاط موقع</span>';
                    };
                    return b;
                }
            });
            map.addControl(new PickCtl());
            const DeleteCtl = L.Control.extend({
                options: { position: 'topright' },
                onAdd() {
                    const b = L.DomUtil.create('button', '');
                    b.innerHTML = '<span class="sx-ic">🗑</span><span class="sx-tl">حذف موقع</span>'; b.title = 'حذف موقع';
                    b.className = 'sx-tool sx-tool-del';
                    L.DomEvent.disableClickPropagation(b);
                    b.onclick = () => {
                        window.stopDelete = () => { if (deleteMode) b.onclick(); };
                        if (!deleteMode && !unlocked) { askPassword(() => b.onclick()); return; }
                        deleteMode = !deleteMode;
                        b.classList.toggle('on', deleteMode);
                        b.innerHTML = deleteMode ? '<span class="sx-ic">🗑</span><span class="sx-tl">اضغط على الدبوس لحذفه...</span>' : '<span class="sx-ic">🗑</span><span class="sx-tl">حذف موقع</span>';
                        if (deleteMode && window.stopPick) window.stopPick();
                    };
                    return b;
                }
            });
            map.addControl(new DeleteCtl());
            const ExportCtl = L.Control.extend({
                options: { position: 'topright' },
                onAdd() {
                    const b = L.DomUtil.create('button', '');
                    b.innerHTML = '<span class="sx-ic">📋</span><span class="sx-tl">نسخ الأماكن المضافة</span>'; b.title = 'نسخ الأماكن المضافة';
                    b.className = 'sx-tool sx-tool-export';
                    L.DomEvent.disableClickPropagation(b);
                    b.onclick = () => exportCustom();
                    return b;
                }
            });
            map.addControl(new ExportCtl());
            // نقل أزرار الأدوات إلى الهيدر بجانب الشعار
            const sxTools = document.getElementById('sxTools');
            document.querySelectorAll('.leaflet-control.sx-tool').forEach(b => sxTools.appendChild(b));

            // بحث الوجهة
            const endSearch = document.getElementById('endSearch');
            const endResults = document.getElementById('endResults');
            endSearch.addEventListener('focus', () => {
                if (endSelect.value) endSearch.select();
                renderEndResults(endSelect.value ? '' : endSearch.value);
            });
            endSearch.addEventListener('input', () => {
                endSelect.value = '';
                renderEndResults(endSearch.value);
                arrived = false;
                updateMarkerFocus();
            });
            endResults.addEventListener('click', (e) => {
                const btn = e.target.closest('.end-item');
                if (btn) chooseEnd(btn.dataset.id);
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#endSearch') && !e.target.closest('#endResults')) hideEndResults();
            });

            // طيّ الواجهة العلوية عند الضغط على الخريطة، وإظهارها بزر "القائمة"
            const topPanel = document.getElementById('topPanel');
            const floatBar = document.getElementById('floatBar');
            const miniInfo = document.getElementById('miniInfo');
            function setPanel(open) {
                topPanel.classList.toggle('collapsed', !open);
                floatBar.classList.toggle('hidden', open);
                floatBar.classList.toggle('flex', !open);
            }
            topPanel.addEventListener('transitionend', (e) => {
                if (e.propertyName === 'max-height') map.invalidateSize();
            });
            document.getElementById('openPanelBtn').addEventListener('click', () => setPanel(true));
            map.on('click', () => { if (!pickMode) setPanel(false); });
            document.getElementById('startWalkBtn').addEventListener('click', () => {
                followUser = true;
                isRoutingActive = true;
                if (watchId === null) document.getElementById('gpsBtn').click();
                setPanel(false);
            });

            // ملخص الوقت والمسافة بجانب الزر أثناء طيّ الواجهة
            function updateMini() {
                const t = document.getElementById('timeDisplay').textContent;
                const d = document.getElementById('distanceDisplay').textContent;
                miniInfo.textContent = (d && d !== '--') ? `${t} • ${d}` : '';
            }
            ['timeDisplay', 'distanceDisplay'].forEach(id => {
                new MutationObserver(updateMini).observe(document.getElementById(id), { childList: true, characterData: true, subtree: true });
            });
            map.on('click', (e) => {
                if (!pickMode) return;
                startNewPlace(e.latlng);
            });

            // خيار "موقعي الحالي" كنقطة انطلاق (أول خيار بعد العنوان)
            startSelect.insertBefore(new Option("📍 موقعي الحالي", "gps"), startSelect.options[1]);
            startSelect.addEventListener('change', () => {
                updateMarkerFocus();
                if (startSelect.value === 'gps') {
                    if (watchId === null) document.getElementById('gpsBtn').click();
                } else if (isRoutingActive && endSelect.value) {
                    drawAndCalculateRoute(true, true);
                }
            });

            setTimeout(() => { map.invalidateSize(); }, 400);

            // التتبع الحي الفعلي
            document.getElementById('gpsBtn').addEventListener('click', () => {
                if (simInterval) { clearInterval(simInterval); simInterval = null; }

                gpsFirstFix = true;
                followUser = true;
                if (!navigator.geolocation) {
                    showMessage("متصفحك لا يدعم تحديد الموقع الجغرافي.");
                    return;
                }

                const gpsBtn = document.getElementById('gpsBtn');
                gpsBtn.classList.replace('bg-red-50', 'bg-red-600');
                gpsBtn.classList.replace('text-red-600', 'text-white');

                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                }

                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const acc = pos.coords.accuracy;

                        ensureGpsOptionSelected();
                        updateLiveUserPosition(lat, lng, acc, false);
                        if (gpsFirstFix) {
                            gpsFirstFix = false;
                            if (isRoutingActive && endSelect.value) {
                                drawAndCalculateRoute(true, true);
                            } else {
                                map.setView([lat, lng], 17);
                            }
                        }
                    },
                    (err) => {
                        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
                        if (startSelect.value === 'gps' && !userLocation) startSelect.value = '';
                        document.getElementById('liveBadge').classList.add('hidden');
                        document.getElementById('liveBadge').classList.remove('flex');
                        gpsBtn.classList.replace('bg-red-600', 'bg-red-50');
                        gpsBtn.classList.replace('text-white', 'text-red-600');
                        showMessage("تعذر تفعيل الـ Live Location (تأكد من فتح الموقع عبر HTTPS وإعطاء صلاحية الـ GPS للمتصفح). يمكنك استخدام زر 'تجربة مشي افتراضي' لتجربة الميزة الآن!");
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000
                    }
                );
            });

            // المشي الافتراضي: يمشي على نفس مسار الشوارع
            document.getElementById('simLiveBtn').addEventListener('click', async () => {
                if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
                if (simInterval) { clearInterval(simInterval); simInterval = null; }

                if (!endSelect.value) {
                    endSelect.value = 'kaddm';
                    syncEndInput();
                }

                followUser = true;
                const startLoc = locations.find(x => x.id === 'clock_tower');
                ensureGpsOptionSelected();
                updateLiveUserPosition(startLoc.lat, startLoc.lng, 8, true);
                isRoutingActive = true;
                await drawAndCalculateRoute(true, true);

                const path = lastRouteCoords.slice();
                if (path.length < 2) return;

                let pos = L.latLng(startLoc.lat, startLoc.lng);
                let idx = 1;
                const STEP_M = WALK_SPEED_MPS * SIM_SPEED; // متر كل ثانية

                simInterval = setInterval(() => {
                    if (idx >= path.length) {
                        clearInterval(simInterval);
                        simInterval = null;
                        return;
                    }
                    let remaining = STEP_M;
                    while (remaining > 0 && idx < path.length) {
                        const target = path[idx];
                        const d = pos.distanceTo(target);
                        if (d <= remaining) {
                            pos = target;
                            remaining -= d;
                            idx++;
                        } else {
                            const f = remaining / d;
                            pos = L.latLng(pos.lat + (target.lat - pos.lat) * f, pos.lng + (target.lng - pos.lng) * f);
                            remaining = 0;
                        }
                    }
                    updateLiveUserPosition(pos.lat, pos.lng, 8, true);
                }, 1000);
            });

            document.getElementById('routeBtn').addEventListener('click', () => {
                const sVal = startSelect.value;
                const eVal = endSelect.value;

                if (!sVal || !eVal) {
                    showMessage("الرجاء اختيار نقطة الانطلاق والوجهة المطلوبة أولاً.");
                    return;
                }

                if (sVal === 'gps' && !userLocation) {
                    isRoutingActive = true;
                    if (watchId === null) document.getElementById('gpsBtn').click();
                    showMessage("جاري تحديد موقعك... سيظهر المسار تلقائياً فور تحديده.");
                    return;
                }

                arrived = false;
                showAllOverride = false;
                isRoutingActive = true;
                drawAndCalculateRoute(true, true);
            });
        });
    </script>
</body>
</html>
